# ==========================================================================
# Configuracion del analisis de SonarCloud para todo el repositorio
# (un solo proyecto de SonarCloud con el back y el front).
# La usa el job `sonar` de .github/workflows/ci.yml.
# ==========================================================================

# --- Identidad del proyecto -----------------------------------------------
# VERIFICA estos dos valores en SonarCloud: proyecto -> "Information"
# (Organization Key y Project Key). Deben coincidir exactamente.
sonar.organization=nexo-vital
sonar.projectKey=Nexo-Vital_NexoVital
sonar.projectName=NexoVital

sonar.sourceEncoding=UTF-8

# --- Que es codigo y que son tests ------------------------------------------
sonar.sources=Back_NexoVital/src/main,Front_NexoVital/src
sonar.tests=Back_NexoVital/src/test,Front_NexoVital/src
# En el front los tests viven junto al codigo: se separan por nombre.
sonar.test.inclusions=Back_NexoVital/src/test/**,Front_NexoVital/src/**/*.test.ts,Front_NexoVital/src/**/*.test.tsx,Front_NexoVital/src/test/**
sonar.exclusions=Front_NexoVital/src/**/*.test.ts,Front_NexoVital/src/**/*.test.tsx,Front_NexoVital/src/test/**

# --- Backend (Java 21) ----------------------------------------------------
sonar.java.source=21
sonar.java.binaries=Back_NexoVital/target/classes
sonar.java.libraries=Back_NexoVital/target/dependency/*.jar
sonar.java.test.binaries=Back_NexoVital/target/test-classes
sonar.java.test.libraries=Back_NexoVital/target/dependency/*.jar

# --- Cobertura --------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=Back_NexoVital/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=Front_NexoVital/coverage/lcov.info
# Datos de demostracion y punto de entrada: no tiene sentido exigirles tests.
sonar.coverage.exclusions=Front_NexoVital/src/mocks/**,Front_NexoVital/src/main.tsx
