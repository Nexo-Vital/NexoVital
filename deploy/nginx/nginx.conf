# ==========================================================================
# Balanceador de carga de NexoVital (ADR-0004).
#
# nginx cumple dos papeles en el despliegue:
#   1. Sirve el frontend compilado (SPA).
#   2. Reparte las peticiones entre las N instancias del backend.
#
# El bloque `upstream` es el balanceador. Agregar o quitar una instancia es
# agregar o quitar una línea: la arquitectura es elástica, la demostración usa
# dos porque el enunciado pide dividir el backend en dos.
#
# WebSocket necesita cabeceras propias (Upgrade/Connection) y un read timeout
# largo: una sesión STOMP puede quedar abierta horas sin mandar nada, y con el
# default de 60 s nginx la cerraría.
# ==========================================================================

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    log_format con_upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout con_upstream;

    # DNS interno de Docker. Necesario para que `resolve` en los `server` del
    # upstream vuelva a resolver el nombre cuando el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # N instancias del backend. El balanceo por defecto es round-robin.
    # max_fails=3: una sola peticion lenta NO saca del reparto a una instancia
    # del reparto por 30 s en vez de seguir mandandole trafico.
    #
    # `resolve` + `zone` (nginx >= 1.27.3): el nombre se vuelve a resolver cada
    # `valid`, en vez de quedar clavado en la IP que habia al arrancar. Sin esto,
    # recrear un backend con `docker compose up --build` le cambia la IP, nginx
    # sigue mandando a la vieja, falla y reintenta en la otra instancia: el
    # reparto queda 0/100 y el balanceador pasa a ser decorativo.
    upstream nexovital_backend {
        zone nexovital_backend 64k;
        server backend-1:8080 resolve max_fails=3 fail_timeout=30s;
        server backend-2:8080 resolve max_fails=3 fail_timeout=30s;
    }

    # El frontend es su propio contenedor: este nginx lo pone delante para que
    # el navegador vea un solo origen y no haya CORS ni handshake cruzado.
    upstream nexovital_frontend {
        server frontend:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        # --- API REST ---------------------------------------------------
        location /api/ {
            proxy_pass http://nexovital_backend;
            proxy_http_version 1.1;
            # Una instancia detenida deja el socket abierto durante el apagado
            # ordenado. Con los timeouts por defecto (60 s) nginx espera un
            # minuto antes de probar la otra: el failover existe pero llega
            # tarde. Se corta a los 5 s y se reintenta en la instancia sana.
            # No se agrega `non_idempotent`: los POST no se reintentan.
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # El limite de solicitudes lee esta cabecera, no remoteAddr:
            # detras del balanceador remoteAddr es siempre la IP de nginx.
            #
            # Se REEMPLAZA con la IP de quien se conecta, no se le agrega
            # ($proxy_add_x_forwarded_for). nginx es la unica entrada (el
            # backend no se publica al host), asi que $remote_addr es el
            # cliente real. Si se agregara, un script podria mandar su propio
            # "X-Forwarded-For: 1.2.3.4", el backend leeria esa primera entrada
            # inventada y evadiria el limite por IP cambiandola en cada peticion
            # (Sprint 2, S-3 / T18).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Permite ver en la respuesta que instancia atendio (demo).
            add_header X-Upstream $upstream_addr always;
        }

        # --- WebSocket / STOMP ------------------------------------------
        location /ws {
            proxy_pass http://nexovital_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # Mismo criterio que /api/: la IP del cliente no se puede inventar.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Actuator (sondeo del balanceador) ---------------------------
        # Solo la salud se publica hacia afuera. Las metricas
        # (/actuator/prometheus) las lee Prometheus directo de cada backend por
        # la red interna (deploy/prometheus/prometheus.yml), asi que no hace
        # falta exponerlas en el puerto publico: dicen cuantas peticiones,
        # errores y usuarios hay, y eso no se le regala a cualquiera (T03).
        location ~ ^/actuator/health(/.*)?$ {
            proxy_pass http://nexovital_backend;
            # Mismos timeouts que /api/: sin esto, una instancia detenida
            # cuelga el sondeo 60 s y el failover parece roto.
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Host $host;
            add_header X-Upstream $upstream_addr always;
        }

        # Cualquier otro endpoint de Actuator: no existe hacia afuera.
        location /actuator/ {
            return 404;
        }

        # --- Frontend (SPA) ----------------------------------------------
        location / {
            proxy_pass http://nexovital_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
