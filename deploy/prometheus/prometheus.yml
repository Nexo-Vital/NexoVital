# ==========================================================================
# Raspado de Prometheus (ADR-0010).
#
# Raspa cada instancia del backend por separado: con el balanceador delante no
# se puede apuntar al puerto publico, porque caeria en una instancia distinta en
# cada intento y las metricas se mezclarian sin control. Cada target conserva su
# etiqueta `instancia` y los tableros pueden agregar o desglosar.
# ==========================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Reglas de alerta (ESC-7). Se evaluan cada `evaluation_interval`; las alertas
# activas se consultan en /alerts. No hay Alertmanager: el compose no envia
# notificaciones, solo deja visible el estado.
rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: nexovital-backend
    metrics_path: /actuator/prometheus
    # Cada 5 s (y no 10) para que la degradacion se vea en el tablero tecnico en
    # 30 s o menos (O-1, T39): raspado 5 s + tiempo limite 4 s + refresco 5 s.
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["backend-1:8080"]
        labels:
          instancia: backend-1
      - targets: ["backend-2:8080"]
        labels:
          instancia: backend-2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
