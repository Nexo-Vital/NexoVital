# ==========================================================================
# Perfil de produccion (SPRING_PROFILES_ACTIVE=prod).
#
# La documentacion de la API NUNCA debe quedar publica en produccion. Se cierra
# con dos barreras independientes:
#
#   1. nexovital.swagger.enabled=false
#      SecurityConfig NO declara las rutas de la documentacion, asi que caen en
#      anyRequest().denyAll() y responden 403. La cadena sigue fail-closed.
#
#   2. springdoc.api-docs.enabled=false / springdoc.swagger-ui.enabled=false
#      springdoc no registra los endpoints en absoluto. Es defensa en
#      profundidad: aunque una regla de seguridad se malconfigurara, no hay
#      handler que sirva la documentacion.
#
# Estas dos propiedades son lo unico que define este perfil; el resto de la
# configuracion de produccion (URL de PostgreSQL, ddl-auto=validate y
# migraciones versionadas) es una tarea aparte.
# ==========================================================================
nexovital.swagger.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
