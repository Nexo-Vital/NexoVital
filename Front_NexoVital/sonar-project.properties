# ==========================================================================
# SonarCloud: proyecto del FRONT (monorepo, junto con NexoVital Back).
# Lo usa el job `sonar` de .github/workflows/ci.yml con
# projectBaseDir=Front_NexoVital: todas las rutas son relativas a esta carpeta.
# ==========================================================================

# --- Identidad del proyecto -----------------------------------------------
# Deben coincidir con SonarCloud: proyecto -> Information.
sonar.organization=nexo-vital
sonar.projectKey=Nexo-Vital_NexoVital-front
sonar.projectName=NexoVital Front

sonar.sourceEncoding=UTF-8

# --- Que es codigo y que son tests ------------------------------------------
# Los tests viven junto al codigo: se separan por nombre.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# --- Cobertura (Vitest, `npm run test:coverage`) -----------------------------
# El reporte nombra los archivos como "src/...", relativos a esta carpeta.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Datos de demostracion y punto de entrada: no tiene sentido exigirles tests.
sonar.coverage.exclusions=src/mocks/**,src/main.tsx

# --- Quality gate -----------------------------------------------------------
# El analisis espera el veredicto del gate y falla si no pasa.
sonar.qualitygate.wait=true
