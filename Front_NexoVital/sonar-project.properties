# ==========================================================================
# SonarCloud: proyecto del FRONT (monorepo, junto con NexoVital Back).
# Lo usa el job `sonar` de .github/workflows/ci.yml con
# projectBaseDir=Front_NexoVital: todas las rutas son relativas a esta carpeta.
#
# Los proyectos nuevos de SonarCloud usan el "nuevo alcance de analisis":
# analizan TODA la carpeta e ignoran sonar.sources / sonar.tests. Por eso el
# alcance se fija con sonar.exclusions, dejando lo mismo que analizaba el
# proyecto original: solo src/, sin los tests.
# ==========================================================================

# --- Identidad del proyecto -----------------------------------------------
sonar.organization=nexo-vital
sonar.projectKey=Nexo-Vital_NexoVital-front
sonar.projectName=NexoVital Front

sonar.sourceEncoding=UTF-8

# --- Alcance: solo src/ ---------------------------------------------------
# Tests de src (viven junto al codigo) + todo lo que esta fuera de src:
# e2e de Playwright, scripts de carga, worker de Cloudflare, configuracion
# del build, nginx, Docker y archivos .env.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,e2e/**,scripts/**,worker/**,docker/**,public/**,.husky/**,Dockerfile,index.html,*.config.ts,*.config.mjs,vite-plugin-dev-realtime.ts,wrangler.jsonc,components.json,biome.json,tsconfig*.json,package.json,package-lock.json,.env*

# --- Cobertura (Vitest, `npm run test:coverage`) -----------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Datos de demostracion y punto de entrada: no tiene sentido exigirles tests.
sonar.coverage.exclusions=src/mocks/**,src/main.tsx

# --- Quality gate -----------------------------------------------------------
sonar.qualitygate.wait=true
