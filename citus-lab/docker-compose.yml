# ==========================================================================
# Laboratorio Citus - NexoVital (Sprint 2)
#
# Demuestra escalado horizontal de la base de datos por ciudad, sin tocar la
# aplicacion. NO es la arquitectura que corre hoy: es un banco de pruebas de
# diseno para responder "si el profesor pidiera escalar la base, asi se haria".
#
# Topologia:
#   coordinador (5433 en el host)
#      |-- worker-1 (shards de las ciudades A y C)
#      |-- worker-2 (shards de las ciudades B y D)
#
# Uso:
#   docker compose up -d
#   ./setup.ps1
#   ./measure-latency.ps1
#   ./test-concurrencia.ps1
#   docker compose down -v     (borra datos del laboratorio)
#
# Seguridad: trust local SOLO para el laboratorio. Nunca en produccion.
# ==========================================================================

name: nexovital-citus-lab

services:
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: citus-coordinator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexovital
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
      - ./sql:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexovital"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: citus-worker-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexovital
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexovital"]
      interval: 5s
      timeout: 3s
      retries: 20

  citus-worker-2:
    image: citusdata/citus:12.1
    container_name: citus-worker-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexovital
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - citus-worker-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexovital"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  citus-coordinator-data:
  citus-worker-1-data:
  citus-worker-2-data:
