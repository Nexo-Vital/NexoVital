# ==========================================================================# ==========================================================================
# Configuration exclusive to the test profile (@ActiveProfiles("test")).
#
# The `test` profile is listed in the DataSeeder @Profile, so the catalog of
# 10 demo users is seeded in every test context.
# ==========================================================================

# --------------------------------------------------------------------------
# JWT. Production has NO default and aborts startup if the secret is missing
# or shorter than 32 bytes (JwtTokenAdapter). The test secret is defined here,
# with an obviously local value and no real secret. The production check is
# not relaxed.
# --------------------------------------------------------------------------
nexovital.jwt.secret=nexovital-test-only-jwt-secret-do-not-use-in-prod-0123456789
nexovital.jwt.expiration=3600000

# --------------------------------------------------------------------------
# In-memory database, isolated from the default one.
# --------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:nexovital-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# Explicit seeding for the test profile (double barrier D3).
# --------------------------------------------------------------------------
nexovital.seed.enabled=true

# --------------------------------------------------------------------------
# Expiry sweep (EP-04.F2.US9). Production runs it every second; the tests
# disable it with a one-hour initial delay so the sweep never races a test.
# The expiry use case is exercised directly, with the controllable clock.
# --------------------------------------------------------------------------
nexovital.solicitud.expiracion-delay-inicial-ms=3600000
nexovital.solicitud.expiracion-intervalo-ms=3600000
nexovital.solicitud.confirmacion-automatica-delay-inicial-ms=3600000
nexovital.solicitud.confirmacion-automatica-intervalo-ms=3600000

# --------------------------------------------------------------------------
# Fleet simulator (EP-04.F1.US1). On by default in development; the tests turn
# it off so no unit moves behind a test's back.
# --------------------------------------------------------------------------
nexovital.flota.simulacion.enabled=false

# --------------------------------------------------------------------------
# Signal-loss sweep (EP-04.F1.US1). Production runs it every second; the tests
# disable it with a one-hour initial delay, like the expiry sweep, and drive
# the use case directly with the controllable clock.
# --------------------------------------------------------------------------
nexovital.flota.senal.delay-inicial-ms=3600000
nexovital.flota.senal.intervalo-ms=3600000
# --------------------------------------------------------------------------
# Driver connection (EP-04.F2.US1). Off in the tests, so a test that opens and
# closes STOMP sessions does not disconnect a unit another test relies on. The
# tests of this rule turn it on themselves.
# --------------------------------------------------------------------------
nexovital.flota.conexion.desconexion-por-sesion=false