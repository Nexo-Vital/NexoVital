# ==========================================================================
# Perfil docker (SPRING_PROFILES_ACTIVE=docker): PostgreSQL PERSISTENTE.
#
# Complementa la DECISION R2 de application.properties:
#   * default / dev : H2 en memoria + create-drop (efimero)
#   * docker        : PostgreSQL + update  (este perfil; conserva datos)
#   * prod          : PostgreSQL + validate (pendiente: migraciones versionadas)
#
# Nunca create-drop aqui: borraria datos reales.
# La conexion se puede sobreescribir por variables de entorno para el deploy
# (Azure/Neon/Supabase), sin tocar el codigo.
# ==========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexovital}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexovital}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexovital}
spring.jpa.hibernate.ddl-auto=update
