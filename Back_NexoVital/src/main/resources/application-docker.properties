# ==========================================================================
# Perfil `docker` (SPRING_PROFILES_ACTIVE=docker).
#
# Es el perfil con el que NexoVital corre en contenedores: en docker-compose
# (local) y en el despliegue del MVP en la nube. Hereda todo lo de
# application.properties y cambia solo el origen de datos:
#
#   * PostgreSQL persistente en lugar de H2 en memoria.
#   * ddl-auto=update: Hibernate crea o ajusta las tablas y NUNCA las borra
#     (decision R2 de application.properties).
#
# Se conservan a proposito, porque el MVP los necesita para la demo:
#   * DataSeeder (usuarios, centros y ambulancias demo): incluye este perfil.
#   * Simulador de flota: corre en todo perfil que no sea `prod`.
#
# Ningun dato de conexion se escribe aqui: llegan por variables de entorno.
# ==========================================================================
spring.datasource.url=${NEXOVITAL_DB_URL:jdbc:postgresql://localhost:5432/nexovital}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEXOVITAL_DB_USER:nexovital}
# Sin valor por defecto A PROPOSITO: si falta, el arranque falla con un mensaje
# claro en lugar de intentar conectarse con una contrasena inventada.
spring.datasource.password=${NEXOVITAL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# ==========================================================================
# Pool de conexiones.
# El maximo sigue siendo 40 por defecto (ver EP-03.F1.US5, FA-6, en
# application.properties), pero ahora es configurable: un PostgreSQL pequeno en
# la nube admite pocas conexiones y el valor debe caber en su limite.
# minimum-idle bajo: sin el, Hikari abre las 40 conexiones al arrancar aunque
# nadie las use.
# ==========================================================================
spring.datasource.hikari.maximum-pool-size=${NEXOVITAL_DB_POOL_MAX:40}
spring.datasource.hikari.minimum-idle=${NEXOVITAL_DB_POOL_MIN:5}
