# ==========================================================================
# Perfil `docker` (SPRING_PROFILES_ACTIVE=docker).
#
# Es el perfil con el que NexoVital corre en contenedores: en docker-compose
# (local) y en el despliegue del MVP en la nube. Hereda todo lo de
# application.properties y cambia solo el origen de datos:
#
#   * PostgreSQL persistente en lugar de H2 en memoria.
#   * ddl-auto=update: Hibernate crea o ajusta las tablas y NUNCA las borra
#     (decision R2 de application.properties).
#
# Se conservan a proposito, porque el MVP los necesita para la demo:
#   * DataSeeder (usuarios, centros y ambulancias demo): incluye este perfil.
#   * Simulador de flota: corre en todo perfil que no sea `prod`.
#
# Ningun dato de conexion se escribe aqui: llegan por variables de entorno.
# ==========================================================================
spring.datasource.url=${NEXOVITAL_DB_URL:jdbc:postgresql://localhost:5432/nexovital}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEXOVITAL_DB_USER:nexovital}
# Sin valor por defecto A PROPOSITO: si falta, el arranque falla con un mensaje
# claro en lugar de intentar conectarse con una contrasena inventada.
spring.datasource.password=${NEXOVITAL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# ==========================================================================
# Pool de conexiones.
# El maximo sigue siendo 40 por defecto (ver EP-03.F1.US5, FA-6, en
# application.properties), pero ahora es configurable: un PostgreSQL pequeno en
# la nube admite pocas conexiones y el valor debe caber en su limite.
# minimum-idle bajo: sin el, Hikari abre las 40 conexiones al arrancar aunque
# nadie las use.
# ==========================================================================
spring.datasource.hikari.maximum-pool-size=${NEXOVITAL_DB_POOL_MAX:40}
spring.datasource.hikari.minimum-idle=${NEXOVITAL_DB_POOL_MIN:5}


# --------------------------------------------------------------------------
# Broker de eventos (ADR-0009). En el despliegue con varias instancias el push
# viaja por un exchange fanout y cada instancia tiene su propia cola.
# --------------------------------------------------------------------------
nexovital.eventos.broker.enabled=true
nexovital.push.exchange=${NEXOVITAL_PUSH_EXCHANGE:nexovital.push}
# En el compose cada instancia trae su NEXOVITAL_INSTANCIA_ID (backend-1, backend-2).
# En Azure las réplicas comparten variables: sin id explícito se usa el HOSTNAME
# del contenedor, que es distinto en cada réplica. Con un id repetido las dos
# instancias consumirían la misma cola y cada evento llegaría solo a una.
nexovital.instancia-id=${NEXOVITAL_INSTANCIA_ID:${HOSTNAME:local}}

# --------------------------------------------------------------------------
# IdP externo (ADR-0008). Con el project-id presente, el filtro HTTP y el
# interceptor STOMP validan ID tokens de Firebase y el login local se apaga.
# Sin esta propiedad, el desarrollo y la suite siguen usando el login local.
# --------------------------------------------------------------------------
nexovital.auth.firebase.project-id=${NEXOVITAL_FIREBASE_PROJECT_ID:nexovital-c96cf}
nexovital.auth.local.enabled=false
# --------------------------------------------------------------------------
# Logs estructurados (ESC-7). En el compose hay varias instancias y los logs se
# recolectan: una linea JSON por evento, con `traceId` como campo (lo publica
# TraceIdFilter en el MDC), en vez del texto legible de desarrollo.
# --------------------------------------------------------------------------
logging.structured.format.console=logstash

# --------------------------------------------------------------------------
# Origenes del front en el compose (CORS y handshake de WebSocket).
# En este despliegue el navegador carga el front desde el mismo nginx
# (http://localhost:8080), no desde Vite (5173). Sin este origen el handshake
# SockJS de STOMP responde 403 "Invalid CORS request" y el conductor se queda
# sin tiempo real: el REST funciona (va por el proxy) pero el WebSocket no.
# Se conservan los de Vite para desarrollar el front contra el back en docker.
# En la nube se define NEXOVITAL_CORS_ORIGENES con la URL publica.
# --------------------------------------------------------------------------
nexovital.cors.origenes-permitidos=${NEXOVITAL_CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
