spring.application.name=nexovital

# ==========================================================================
# Origen de datos — perfil por defecto (desarrollo local): H2 en memoria.
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:nexovital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================================
# DECISIÓN R2 — creación del esquema por perfil.
# El pom.xml no incluye motor de migraciones (ni Flyway ni Liquibase), así que
# hoy el esquema lo genera Hibernate. Decisión explícita:
#   * default / dev : create-drop  -> H2 en memoria; el esquema se recrea en
#                                     cada arranque y se borra al apagar.
#   * docker        : update       -> PostgreSQL persistente; nunca create-drop
#                                     (borraría datos reales).
#   * prod          : validate     -> el esquema debe existir previamente.
# Para producción esto significa que hace falta introducir migraciones
# versionadas (Flyway/Liquibase) y un `application-prod.properties` con la URL
# de PostgreSQL y `ddl-auto=validate`. Es una tarea aparte: agregar un motor de
# migraciones está fuera del alcance de esta historia.
# ==========================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ==========================================================================
# Pool de conexiones (EP-03.F1.US5, FA-6).
# Un despacho rechazado persiste su alerta de escasez en una transacción
# aparte (REQUIRES_NEW) mientras la transacción del despacho todavía retiene
# su propia conexión. Con el valor por defecto (10) una ráfaga de rechazos
# concurrentes agota el pool y se bloquea a sí misma: cada hilo necesita dos
# conexiones a la vez. El margen cubre 2 conexiones por hilo concurrente.
# ==========================================================================
spring.datasource.hikari.maximum-pool-size=40

# ==========================================================================
# JWT (HS256).
# Sin valor fijo A PROPÓSITO: un secreto comiteado permite a cualquiera con
# acceso al repositorio forjar tokens válidos.
# - Perfil prod: NEXOVITAL_JWT_SECRET es obligatorio; sin él el arranque aborta.
# - Desarrollo (sin perfil prod): si no está definido, JwtTokenAdapter genera
#   un secreto aleatorio en memoria para esa ejecución (los tokens dejan de
#   valer al reiniciar).
# Definido pero con menos de 32 bytes aborta el arranque en cualquier perfil.
# ==========================================================================
nexovital.jwt.secret=${NEXOVITAL_JWT_SECRET:}
nexovital.jwt.expiration=${NEXOVITAL_JWT_EXPIRATION:3600000}

# ==========================================================================
# Documentacion de la API (springdoc-openapi).
# `true` deja Swagger UI y /v3/api-docs accesibles en dev/test: SecurityConfig
# declara esas rutas UNICAMENTE cuando esta propiedad es true, y mantiene el
# resto de la cadena fail-closed. El perfil `prod` la apaga
# (application-prod.properties) para que la documentacion nunca quede publica.
# No se expone variable de entorno a proposito: apagarla es decision de perfil,
# no una opcion de entorno.
# ==========================================================================
nexovital.swagger.enabled=true

# ==========================================================================
# Siembra de usuarios demo (diseño D2/D3).
# Doble barrera: @Profile({"default","docker","test"}) en DataSeeder y esta
# propiedad. Con el perfil `prod` el seeder no existe, aunque la propiedad
# herede este valor.
# ==========================================================================
nexovital.seed.enabled=${NEXOVITAL_SEED_ENABLED:true}

# ==========================================================================
# Logging
# ==========================================================================
logging.level.co.edu.escuelaing.nexovital=INFO

# ==========================================================================
# Simulador de flota (EP-04.F1.US1, D-T4).
# Apagado por defecto: exige opt-in explícito. Además, el bean lleva
# @Profile("!prod"), así que NUNCA corre en el perfil `prod` aunque la
# propiedad se fuerce a true. Mueve las ambulancias DISPONIBLE unos metros por
# ciclo para que la demo muestre movimiento; escribe por el mismo caso de uso
# que el conductor.
# ==========================================================================
nexovital.flota.simulacion.enabled=${NEXOVITAL_FLOTA_SIMULACION:false}

# ==========================================================================
# Ventana de aceptación de una solicitud (EP-04.F2.US9).
# Política del servidor: el deadline se calcula en el caso de uso con el
# reloj del servidor y este valor. El cliente NO propone timeout.
# ==========================================================================
nexovital.solicitud.timeout-segundos=60
