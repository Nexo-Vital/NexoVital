spring.application.name=nexovital

# ==========================================================================
# Origen de datos — perfil por defecto (desarrollo local): H2 en memoria.
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:nexovital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================================
# DECISIÓN R2 — creación del esquema por perfil.
# El pom.xml no incluye motor de migraciones (ni Flyway ni Liquibase), así que
# hoy el esquema lo genera Hibernate. Decisión explícita:
#   * default / dev : create-drop  -> H2 en memoria; el esquema se recrea en
#                                     cada arranque y se borra al apagar.
#   * docker        : update       -> PostgreSQL persistente; nunca create-drop
#                                     (borraría datos reales).
#   * prod          : validate     -> el esquema debe existir previamente.
# Para producción esto significa que hace falta introducir migraciones
# versionadas (Flyway/Liquibase) y un `application-prod.properties` con la URL
# de PostgreSQL y `ddl-auto=validate`. Es una tarea aparte: agregar un motor de
# migraciones está fuera del alcance de esta historia.
# ==========================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ==========================================================================
# Pool de conexiones (EP-03.F1.US5, FA-6).
# Un despacho rechazado persiste su alerta de escasez en una transacción
# aparte (REQUIRES_NEW) mientras la transacción del despacho todavía retiene
# su propia conexión. Con el valor por defecto (10) una ráfaga de rechazos
# concurrentes agota el pool y se bloquea a sí misma: cada hilo necesita dos
# conexiones a la vez. El margen cubre 2 conexiones por hilo concurrente.
# ==========================================================================
spring.datasource.hikari.maximum-pool-size=40

# ==========================================================================
# JWT (HS256).
# Sin valor fijo A PROPÓSITO: un secreto comiteado permite a cualquiera con
# acceso al repositorio forjar tokens válidos.
# - Perfil prod: NEXOVITAL_JWT_SECRET es obligatorio; sin él el arranque aborta.
# - Desarrollo (sin perfil prod): si no está definido, JwtTokenAdapter genera
#   un secreto aleatorio en memoria para esa ejecución (los tokens dejan de
#   valer al reiniciar).
# Definido pero con menos de 32 bytes aborta el arranque en cualquier perfil.
# ==========================================================================
nexovital.jwt.secret=${NEXOVITAL_JWT_SECRET:}
nexovital.jwt.expiration=${NEXOVITAL_JWT_EXPIRATION:3600000}

# ==========================================================================
# Documentacion de la API (springdoc-openapi).
# `true` deja Swagger UI y /v3/api-docs accesibles en dev/test: SecurityConfig
# declara esas rutas UNICAMENTE cuando esta propiedad es true, y mantiene el
# resto de la cadena fail-closed. El perfil `prod` la apaga
# (application-prod.properties) para que la documentacion nunca quede publica.
# No se expone variable de entorno a proposito: apagarla es decision de perfil,
# no una opcion de entorno.
# ==========================================================================
nexovital.swagger.enabled=true

# ==========================================================================
# Siembra de usuarios demo (diseño D2/D3).
# Doble barrera: @Profile({"default","docker","test"}) en DataSeeder y esta
# propiedad. Con el perfil `prod` el seeder no existe, aunque la propiedad
# herede este valor.
# ==========================================================================
nexovital.seed.enabled=${NEXOVITAL_SEED_ENABLED:true}

# ==========================================================================
# Administrador de plataforma (EP-06.F2.US1, T10).
# Nadie puede elegir este rol al registrarse: se precarga con este correo en
# todos los perfiles (AdministradorPlataformaInicial) y queda enlazado a su
# cuenta de Google la primera vez que entra, si Google confirma el correo.
# En Azure se fija con la variable NEXOVITAL_ADMIN_EMAIL. Vacio = no se crea.
# ==========================================================================
nexovital.admin.email=${NEXOVITAL_ADMIN_EMAIL:nexovital1@gmail.com}

# ==========================================================================
# Autenticacion propia: APAGADA por defecto (ADR-0008).
# El producto se autentica con Firebase; el login por email y contrasena es un
# recurso de desarrollo y de la suite de pruebas. Arranca apagado para que un
# perfil mal elegido no reviva el proveedor de identidad casero: sin esta
# propiedad, POST /api/v1/sesiones responde 404. docker y prod la fijan en
# false como segunda barrera; application-test.properties la enciende; para
# levantar el backend en local se usa NEXOVITAL_AUTH_LOCAL_ENABLED=true.
# ==========================================================================
nexovital.auth.local.enabled=${NEXOVITAL_AUTH_LOCAL_ENABLED:false}

# ==========================================================================
# Logging
# ==========================================================================
logging.level.co.edu.escuelaing.nexovital=INFO

# Correlacion de logs (ESC-7). TraceIdFilter pone `traceId` en el MDC de cada
# peticion HTTP; este patron lo imprime en la consola de desarrollo. En
# docker/prod la consola pasa a JSON (logstash) y el MDC viaja como campo.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-sin-traza}] [%t] %-40.40logger{39} : %m%n

# ==========================================================================
# Simulador de flota (EP-04.F1.US1, D2/D3 del diseño).
# Encendido por defecto en desarrollo: sin él las ambulancias no se mueven.
# El bean lleva @Profile("!prod"), así que NUNCA corre en el perfil `prod`
# aunque la propiedad se fuerce a true; el perfil `test` lo apaga.
# Cada 5 s mueve unos metros toda unidad activa (cualquier estado menos
# MANTENIMIENTO) que tenga conductor y que NO esté tomada por un dispositivo
# real. Escribe por el mismo caso de uso que el conductor.
# ==========================================================================
nexovital.flota.simulacion.enabled=${NEXOVITAL_FLOTA_SIMULACION:true}
nexovital.flota.simulacion.intervalo-ms=5000
nexovital.flota.simulacion.delay-inicial-ms=5000

# ==========================================================================
# Pérdida de señal (EP-04.F1.US1, D4/D5 del diseño).
# Una unidad que lleva más de `umbral-ms` sin reportar posición queda marcada
# "sin señal" y conserva su última posición. El barrido corre en el servidor
# cada `intervalo-ms`; la marca es un UPDATE condicionado, así que dos barridos
# no publican dos veces y un reporte simultáneo siempre gana.
# ==========================================================================
nexovital.flota.senal.umbral-ms=30000
nexovital.flota.senal.intervalo-ms=1000
nexovital.flota.senal.delay-inicial-ms=5000
# ==========================================================================
# Conexión del conductor (EP-04.F2.US1, D4 del diseño).
# Cuando se cierra la última sesión de tiempo real de un conductor (pestaña
# cerrada, recarga, cierre de sesión o corte de red), su unidad queda
# desconectada y deja de recibir solicitudes nuevas. Una unidad con una
# solicitud aceptada no se desconecta.
# ==========================================================================
nexovital.flota.conexion.desconexion-por-sesion=true

# Si el ciudadano no confirma la llegada, se confirma sola tras este plazo.
nexovital.solicitud.confirmacion-automatica-segundos=${NEXOVITAL_CONFIRMACION_AUTOMATICA_SEGUNDOS:60}
nexovital.solicitud.confirmacion-automatica-intervalo-ms=2000

# ==========================================================================
# Origenes permitidos del frontend (CORS y handshake de WebSocket).
# En desarrollo es el servidor de Vite. En contenedores y en la nube se define
# NEXOVITAL_CORS_ORIGENES con la URL publica del front; varios valores se
# separan con coma. Lo leen SecurityConfig y WebSocketConfig.
# ==========================================================================
nexovital.cors.origenes-permitidos=${NEXOVITAL_CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}

# ==========================================================================
# Endpoint de salud (Actuator).
# Solo se expone `health`, sin detalles: responde {"status":"UP"} cuando la
# aplicacion y la base de datos estan disponibles. `probes` agrega
# /actuator/health/liveness y /actuator/health/readiness para la nube.
# El chequeo de RabbitMQ se apaga: la dependencia AMQP esta en el pom pero no
# hay broker, y sin esto la salud responderia DOWN aunque todo funcione.
# ==========================================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false

# Histogramas de latencia (ESC-7). Micrometer NO publica los buckets de
# `http.server.requests` por defecto: sin esta propiedad Prometheus solo recibe
# `_count` y `_sum`, y `histogram_quantile` devuelve vacio. Los paneles de p95 y
# las alertas NexoVitalLatenciaP95Alta/Critica quedarian mudos. Con los buckets,
# el p95 del tablero tecnico y el objetivo O1 (1 s) son medibles.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==========================================================================
# Propagacion de eventos entre instancias (ADR-0009).
#
# Apagado por defecto: en desarrollo hay una sola instancia y no hay broker, asi
# que el push se entrega directo a las sesiones locales. El perfil docker lo
# enciende, porque ahi si hay varias instancias y una cola por instancia.
# ==========================================================================
nexovital.eventos.broker.enabled=false
nexovital.push.exchange=nexovital.push
# El identificador cae al hostname del contenedor si nadie lo fija: con orquestadores
# que escalan replicas (compose --scale, Kubernetes) el hostname ya es unico y la
# cola por instancia del fan-out no colisiona.
nexovital.instancia-id=${NEXOVITAL_INSTANCIA_ID:${HOSTNAME:local}}

# ==========================================================================
# Un esquema por modulo (ADR-0003).
#
# Las entidades declaran su esquema y Hibernate lo crea si falta. Sin esto la
# frontera entre modulos seria solo una convencion de carpetas: las tablas
# seguirian todas en `public` y cualquiera podria unirlas sin querer.
# ==========================================================================
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Apagado ordenado: al detener una instancia, deja de aceptar y termina las
# peticiones en vuelo antes de morir. Sin esto, un deploy o un stop corta
# respuestas a la mitad y el failover las cuenta como errores.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s