# ==========================================================================
# SonarCloud: proyecto del BACK (monorepo, junto con NexoVital Front).
# Lo usa el job `sonar` de .github/workflows/ci.yml con
# projectBaseDir=Back_NexoVital: todas las rutas son relativas a esta carpeta.
# ==========================================================================

# --- Identidad del proyecto -----------------------------------------------
# Deben coincidir con SonarCloud: proyecto -> Information.
sonar.organization=nexo-vital
sonar.projectKey=Nexo-Vital_NexoVital-back
sonar.projectName=NexoVital Back

sonar.sourceEncoding=UTF-8

# --- Que es codigo y que son tests ------------------------------------------
sonar.sources=src/main
sonar.tests=src/test

# --- Java 21 ----------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.binaries=target/test-classes
sonar.java.test.libraries=target/dependency/*.jar

# --- Cobertura (JaCoCo, perfil `cobertura` del pom.xml) ----------------------
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Quality gate -----------------------------------------------------------
# El analisis espera el veredicto del gate y falla si no pasa.
sonar.qualitygate.wait=true
