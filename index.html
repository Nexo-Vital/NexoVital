<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060a10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Nexo Vital</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      // ThemeProvider re-applies (and listens for OS changes) once React mounts.
      (() => {
        try {
          const preference = localStorage.getItem('nexovital.theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = preference === 'dark' || (preference !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          // localStorage can be unavailable; ThemeProvider applies the class anyway.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
